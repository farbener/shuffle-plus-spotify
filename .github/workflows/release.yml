name: Release
# Builds the patch bundle (.mpp) and attaches it to a GitHub release when a version tag is pushed.
# The Morphe Gradle plugin comes from GitHub Packages, which needs a token with read:packages:
# add one as the repository secret MORPHE_PACKAGES_TOKEN.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
        run: ./gradlew :patches:build --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" patches/build/libs/*.mpp --generate-notes
